<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Pessoa</title>
</head>
<body>
  <header>
    <h1>Editar Pessoa</h1>
    <p>ID: {{ person.id }}</p>
  </header>

  <main>
    <form method="post">
      <p>
        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nome" value="{{ person.nome }}">
      </p>
      <p>
        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email" value="{{ person.email }}">
      </p>
      <p>
        <label for="telefone">Telefone:</label><br>
        <input type="text" id="telefone" name="telefone" value="{{ person.telefone or '' }}">
      </p>
      <p>
        <label for="cidade">Cidade:</label><br>
        <input type="text" id="cidade" name="cidade" value="{{ person.cidade or '' }}">
      </p>
      <p>
        <label for="status">Status:</label><br>
        <select id="status" name="status">
          {% for option in status_options %}
            <option value="{{ option }}" {% if person.status == option %}selected{% endif %}>{{ option|capitalize }}</option>
          {% endfor %}
        </select>
      </p>
      <button type="submit">Salvar alterações</button>
    </form>

    <p><a href="/">Voltar para a lista</a></p>
  </main>
</body>
</html>
