worker_processes  auto;

events {
    worker_connections  2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Pool de Replicas do Servidor Web Flask (Balanceamento Round-Robin + Failover)
    upstream servidores_flask {
        server 127.0.0.1:5001 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:5002 max_fails=2 fail_timeout=5s;
    }

    server {
        listen       5000;
        server_name  localhost 127.0.0.1;

        location / {
            proxy_pass         http://servidores_flask;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            # Se uma replica do Flask falhar ou cair, redireciona imediatamente para a outra (inclusive POST)
            proxy_connect_timeout 2s;
            proxy_read_timeout    15s;
            proxy_next_upstream   error timeout http_502 http_503 http_504 non_idempotent;
        }
    }
}
